[project]
name = "repo-mcp-gateway"
version = "0.4.2"
description = "Multi-tenant MCP gateway for centralized code intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "repo-mcp-common",
]

[tool.uv.sources]
repo-mcp-common = { path = "../common" }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    # Starlette's TestClient warns that a future version will want httpx 2.x.
    # That is starlette's own transitive dependency to manage, not ours, and it
    # is noise in our output until they ship it — a real error still fails.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
