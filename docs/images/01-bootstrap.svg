<text x="22" y="64" fill="#7c8798" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">$ make dev</text>
<text x="22" y="106" fill="#7ee2a8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">==&gt; preparing the development database</text>
<text x="22" y="127" fill="#7ee2a8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">  ok seeded from deploy/tenants.yaml and deploy/scan.yaml</text>
<text x="22" y="169" fill="#d5dde8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">Development mode (JWT verification disabled)</text>
<text x="22" y="190" fill="#d5dde8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">  gateway   http://127.0.0.1:8080/mcp</text>
<text x="22" y="211" fill="#d5dde8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">  indexer   http://127.0.0.1:8082</text>
<text x="22" y="232" fill="#d5dde8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">  token     devtoken</text>
<text x="22" y="253" fill="#d5dde8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">  groups    chapter-devops,chapter-test,squad-payments,squad-payments-leads</text>
<text x="22" y="274" fill="#d5dde8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">  data      /home/user/repo-mcp/.dev</text>
<text x="22" y="295" fill="#d5dde8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">  database  sqlite+aiosqlite:////home/user/repo-mcp/.dev/repo-mcp.db</text>
<text x="22" y="316" fill="#d5dde8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">  admin     admin / devadmin-password  (POST /admin/login)</text>
