<svg xmlns="http://www.w3.org/2000/svg" width="682" height="448" viewBox="0 0 682 448" role="img" aria-label="MCP: tools/list">
<rect width="682" height="448" rx="10" fill="#12161c"/>
<path d="M0 10a10 10 0 0 1 10-10h662a10 10 0 0 1 10 10v24H0z" fill="#1b212a"/>
<circle cx="20" cy="17.0" r="6" fill="#ff5f57"/>
<circle cx="38" cy="17.0" r="6" fill="#febc2e"/>
<circle cx="56" cy="17.0" r="6" fill="#28c840"/>
<text x="341.0" y="21.0" fill="#8ab4f8" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">MCP: tools/list</text>
<text x="22" y="64" fill="#7c8798" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">$ curl -s localhost:8080/mcp -H &#x27;Authorization: Bearer $TOKEN&#x27; \</text>
<text x="22" y="85" fill="#d5dde8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">    -d &#x27;{&quot;jsonrpc&quot;:&quot;2.0&quot;,&quot;id&quot;:1,&quot;method&quot;:&quot;tools/list&quot;}&#x27; | jq</text>
<text x="22" y="127" fill="#d5dde8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">{</text>
<text x="22" y="148" fill="#d5dde8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">  &quot;jsonrpc&quot;: &quot;2.0&quot;, &quot;id&quot;: 1,</text>
<text x="22" y="169" fill="#d5dde8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">  &quot;result&quot;: { &quot;tools&quot;: [</text>
<text x="22" y="190" fill="#d5dde8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">    { &quot;name&quot;: &quot;search_graph&quot; },</text>
<text x="22" y="211" fill="#d5dde8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">    { &quot;name&quot;: &quot;query_graph&quot; },</text>
<text x="22" y="232" fill="#d5dde8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">    { &quot;name&quot;: &quot;trace_path&quot; },</text>
<text x="22" y="253" fill="#d5dde8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">    { &quot;name&quot;: &quot;get_code_snippet&quot; },</text>
<text x="22" y="274" fill="#d5dde8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">    { &quot;name&quot;: &quot;get_graph_schema&quot; },</text>
<text x="22" y="295" fill="#d5dde8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">    { &quot;name&quot;: &quot;get_architecture&quot; },</text>
<text x="22" y="316" fill="#d5dde8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">    { &quot;name&quot;: &quot;search_code&quot; }</text>
<text x="22" y="337" fill="#d5dde8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">  ] }</text>
<text x="22" y="358" fill="#d5dde8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve">}</text>
<text x="22" y="400" fill="#7c8798" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve"># 7 tools, and this squad sees all of them: its profile is</text>
<text x="22" y="421" fill="#7c8798" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" xml:space="preserve"># read-only, so nothing that mutates a graph was offered in the first place.</text>
</svg>
