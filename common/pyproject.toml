[project]
name = "repo-mcp-common"
version = "0.4.9"
description = "Shared database, configuration and bootstrap layer for repo-mcp"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "pyyaml>=6.0",
    # Repository discovery lives here rather than in the indexer because the
    # gateway checks a connector before the indexer ever runs it.
    "httpx>=0.27",
    # SQLite is a supported target for a single-machine development run
    # (scripts/dev.sh) and for the tests. Anything shared uses PostgreSQL —
    # see docs/environments.md.
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    # The shell scripts are part of the contract and CI lints them; shipping
    # the linter with the dev environment is what keeps that a local failure
    # rather than a surprise on a push.
    "shellcheck-py>=0.10",
]

[project.scripts]
repo-mcp-admin = "repo_mcp_common.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["repo_mcp_common*"]

[tool.setuptools.package-data]
repo_mcp_common = ["migrations/*", "migrations/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
