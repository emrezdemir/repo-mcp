{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "repo-mcp.fullname" . }}
  labels:
    {{- include "repo-mcp.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- $fullname := include "repo-mcp.fullname" . }}
    {{- $gatewayPort := .Values.gateway.service.port }}
    {{- $indexerPort := .Values.indexer.service.port }}
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ printf "%s-%s" $fullname (default "gateway" .service) }}
                port:
                  number: {{ if eq (default "gateway" .service) "indexer" }}{{ $indexerPort }}{{ else }}{{ $gatewayPort }}{{ end }}
          {{- end }}
    {{- end }}
{{- end }}
