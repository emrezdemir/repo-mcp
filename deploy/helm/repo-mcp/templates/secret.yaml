{{- include "repo-mcp.validate" . -}}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "repo-mcp.fullname" . }}-secrets
  labels:
    {{- include "repo-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Not optional: a pod cannot reach any of its configuration without these.
  DATABASE_URL: {{ required "database.url is required unless secrets.existingSecret supplies DATABASE_URL" .Values.database.url | quote }}
  SECRETS_KEY: {{ required "secretsKey is required unless secrets.existingSecret supplies SECRETS_KEY" .Values.secretsKey | quote }}
  {{- range $key, $value := .Values.secrets.data }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
