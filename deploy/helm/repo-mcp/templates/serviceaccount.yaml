{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "repo-mcp.serviceAccountName" . }}
  labels:
    {{- include "repo-mcp.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Neither service talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
