{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
{{- range $component := list "gateway" "indexer" }}
{{- if (index $.Values $component).enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "repo-mcp.fullname" $ }}-{{ $component }}
  labels:
    {{- include "repo-mcp.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
    {{- with $.Values.metrics.serviceMonitor.labels }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  selector:
    matchLabels:
      {{- include "repo-mcp.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ $.Values.metrics.serviceMonitor.interval }}
{{- end }}
{{- end }}
{{- end }}
