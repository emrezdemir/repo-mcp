# Default values for repo-mcp.
#
# Read docs/scaling.md before raising gateway.replicaCount or
# indexer.replicaCount — the storage topology constrains both.
# Read docs/environments.md before deploying a second environment.

nameOverride: ""
fullnameOverride: ""

# Free-form label, reported by /readyz and stamped on the pods. Setting it to
# "production" turns on the guards described in docs/environments.md: a
# mutable image tag is refused rather than deployed.
environment: ""

image:
  # A base: the component is appended, giving <repository>-gateway and
  # <repository>-indexer. They are two images from one Dockerfile, and they
  # always share a tag — the engine refuses to run mixed builds against a
  # shared cache root.
  repository: ghcr.io/emrezdemir/repo-mcp
  # Defaults to v<appVersion> of the chart. In production this must be an
  # immutable tag — a release (v1.2.0) or a commit (sha-1a2b3c4).
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# The engine enforces an exact-build admission barrier across every process
# sharing a cache root. Both services therefore run one pinned image; a
# half-upgraded release fails with a version cohort conflict, which is why the
# gateway uses Recreate rather than RollingUpdate.
engine:
  version: "latest"

# ── configuration store ───────────────────────────────────────────────
# Squads, roles, connectors, secrets and settings live in PostgreSQL and are
# changed through the admin API — see docs/adr/0006-configuration-in-the-database.md.
# The chart does not run a database: point this at one you operate.
#
# Every environment gets its own database and its own secretsKey. Sharing
# either would let dev access decrypt production credentials.
database:
  # postgresql+asyncpg://repomcp:PASSWORD@postgres.example:5432/repomcp
  # Leave empty and supply DATABASE_URL through secrets.existingSecret to keep
  # the password out of values files and CI logs.
  url: ""
  poolSize: 5
  poolMaxOverflow: 5
  # How long a starting service keeps retrying an unreachable database before
  # giving up with a readable message.
  connectRetrySeconds: 60
  # How often a running service re-checks the configuration generation
  # counter, which is how an admin change reaches every replica.
  configPollSeconds: 15

# Fernet key encrypting provider tokens at rest. Identical on every replica,
# stable forever: losing it means re-entering every credential.
#   repo-mcp-admin generate-key
# Leave empty and supply SECRETS_KEY through secrets.existingSecret.
secretsKey: ""

migrations:
  # Apply the schema as a Helm pre-install/pre-upgrade hook. Off by default:
  # in production a migration should be a decision, not a side effect of a
  # deploy (docs/adr/0008-environments-and-promotion.md). Turn it on in dev.
  auto: false
  # Create the first administrator in the same hook, if none exists. Harmless
  # to leave on: it does nothing once an administrator exists.
  bootstrapAdmin: true
  adminUsername: admin
  # Leave empty and a password is generated and printed once in the hook's
  # logs. Change it at the first login.
  adminPassword: ""
  backoffLimit: 2
  # Delete the hook Job this many seconds after it finishes. Keep it long
  # enough to read a generated password out of the logs.
  ttlSecondsAfterFinished: 3600

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

# ── gateway ───────────────────────────────────────────────────────────
gateway:
  enabled: true
  replicaCount: 1

  # One uvicorn worker per pod. Each worker would spawn its own engine process
  # per tenant, so concurrency comes from replicas, not workers.
  webConcurrency: 1

  service:
    type: ClusterIP
    port: 8080
    annotations: {}

  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 4Gi }

  # Reads the graph. Safe to scale out only when every tenant uses a read-only
  # tool profile (analysis or scout) — see docs/scaling.md.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  # Process-level only. Identity, squads, the model backend and the engine
  # timeouts are administered in the database, not here.
  config:
    logLevel: info

  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# ── indexer ───────────────────────────────────────────────────────────
indexer:
  enabled: true
  # The queue and its per-project locks live in process. Running more than one
  # replica means two pods can index the same project at once and contend on
  # the engine's mutation lock. Keep this at 1 until a shared queue exists
  # (docs/roadmap.md).
  replicaCount: 1

  service:
    type: ClusterIP
    port: 8080
    annotations: {}

  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { memory: 8Gi }

  # Process-level only. Concurrency and the rescan interval are administered
  # in the database (indexer.concurrency, indexer.rescan_interval_seconds);
  # raise concurrency together with the memory limit below, since indexing is
  # RAM-first.
  config:
    logLevel: info

  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# ── storage ───────────────────────────────────────────────────────────
persistence:
  enabled: true

  cache:
    # The graph stores. SQLite in WAL mode: many readers, one writer, on a
    # POSIX filesystem. Do NOT put this on NFS — WAL locking is unreliable
    # there and the stores will corrupt.
    size: 100Gi
    storageClass: ""
    # ReadWriteOnce keeps everything on one node, which is correct for a
    # single gateway replica. Scaling the gateway out needs ReadWriteMany on a
    # block-backed filesystem, or the synced topology in docs/scaling.md.
    accessMode: ReadWriteOnce
    existingClaim: ""

  repos:
    # Working copies. Cloned with --filter=blob:none, so this is far smaller
    # than the sum of full clones.
    size: 200Gi
    storageClass: ""
    accessMode: ReadWriteOnce
    existingClaim: ""

# ── secrets ───────────────────────────────────────────────────────────
# Squads, connectors and provider tokens are NOT set here — they live in the
# database and are entered through the admin API, once per environment. What
# remains here is what a pod needs before it can read the database, plus the
# webhook and CI secrets the indexer verifies in-process.
secrets:
  # Provide an existing secret instead of the values below. Recommended: it
  # keeps DATABASE_URL and SECRETS_KEY out of values files and CI logs. It
  # must carry the same keys listed under data.
  existingSecret: ""
  create: true
  data:
    WEBHOOK_SECRET_GITHUB: ""
    WEBHOOK_SECRET_GITLAB: ""
    WEBHOOK_SECRET_BITBUCKET: ""
    CI_TRIGGER_TOKEN: ""

# ── ingress ───────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: repo-mcp.example.com
      paths:
        - path: /mcp
          pathType: Prefix
          service: gateway
        - path: /webhook
          pathType: Prefix
          service: indexer
  tls: []

# ── observability ─────────────────────────────────────────────────────
metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

# ── network policy ────────────────────────────────────────────────────
networkPolicy:
  enabled: false
  # Namespaces allowed to reach the gateway.
  allowedNamespaces: []
  # Egress is needed for: git providers, the OIDC issuer and LiteLLM.
  allowExternalEgress: true
