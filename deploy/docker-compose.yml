# Local evaluation stack. For production see docs/deployment.md and
# docs/scaling.md; the Helm chart in deploy/helm is the supported path.

name: repo-mcp

x-service-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-build-args: &build-args
  context: ..
  dockerfile: deploy/Dockerfile

services:
  # Bundled PostgreSQL so `make up` needs nothing external. To use your own
  # instead: set DATABASE_URL in deploy/.env and start with
  #   docker compose up -d --scale postgres=0
  postgres:
    <<: *defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repomcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-repomcp}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repomcp} -d ${POSTGRES_DB:-repomcp}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Applies migrations and creates the first administrator, then exits. Both
  # services wait for it, so a fresh deployment reaches a usable state without
  # anyone reading a runbook.
  init:
    <<: *defaults
    restart: "no"
    build:
      <<: *build-args
      args:
        SERVICE: gateway
        CBM_VERSION: ${CBM_VERSION:-latest}
    depends_on:
      postgres: { condition: service_healthy, required: false }
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://repomcp:${POSTGRES_PASSWORD}@postgres:5432/repomcp}
      SECRETS_KEY: ${SECRETS_KEY:?set SECRETS_KEY — generate one with 'make generate-key'}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Local evaluation applies migrations automatically. The Helm chart
      # defaults this to false — see docs/adr/0008-environments-and-promotion.md.
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
      ENVIRONMENT: ${ENVIRONMENT:-local}
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["repo-mcp-admin", "init"]

  keycloak:
    <<: *defaults
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    ports: ["8081:8080"]
    volumes:
      # Drop a realm export here with LDAP federation and the group mapper
      # already configured. See docs/deployment.md.
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  litellm:
    <<: *defaults
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
    ports: ["4000:4000"]
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness',timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Optional prompt compression, in front of LiteLLM. Upstream software, run
  # from its own pinned image — updating it is bumping HEADROOM_VERSION, and
  # nothing here is a copy of it. Start it with:
  #
  #   docker compose --profile headroom up -d
  #
  # then point the platform at it and turn it on:
  #
  #   repo-mcp-admin set headroom.base_url http://headroom:8787/v1
  #   repo-mcp-admin set headroom.enabled true
  #
  # Its own upstream routing is configured by its own environment; put those
  # variables in deploy/.env and they are passed through untouched.
  # See docs/adr/0010-headroom-plugin.md.
  headroom:
    <<: *defaults
    profiles: ["headroom"]
    image: ghcr.io/chopratejas/headroom:${HEADROOM_VERSION:-latest}
    command: ["headroom", "proxy", "--port", "8787"]
    environment:
      HEADROOM_OUTPUT_SHAPER: ${HEADROOM_OUTPUT_SHAPER:-1}
      # An air-gapped or offline stack should not be phoning home on start.
      HEADROOM_UPDATE_CHECK: "off"
      OPENAI_BASE_URL: ${HEADROOM_UPSTREAM_URL:-http://litellm:4000/v1}
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
    ports: ["8787:8787"]

  # Optional local model backend. Remove it and point LiteLLM at your own
  # proxy if you already run one.
  ollama:
    <<: *defaults
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        limits: { memory: "${OLLAMA_MEMORY_LIMIT:-16g}" }

  gateway:
    <<: *defaults
    build:
      <<: *build-args
      args:
        SERVICE: gateway
        CBM_VERSION: ${CBM_VERSION:-latest}
    depends_on:
      init: { condition: service_completed_successfully }
      litellm: { condition: service_healthy }
    environment:
      # Tenants, roles, connectors, OIDC and LiteLLM settings all live in the
      # database and are changed through the admin API. Only bootstrap values
      # are here. See docs/adr/0006-configuration-in-the-database.md.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://repomcp:${POSTGRES_PASSWORD}@postgres:5432/repomcp}
      SECRETS_KEY: ${SECRETS_KEY:?set SECRETS_KEY — generate one with 'make generate-key'}
      CONFIG_POLL_SECONDS: ${CONFIG_POLL_SECONDS:-15}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      # Local evaluation without Keycloak: set DEV_INSECURE_AUTH=true and a
      # DEV_STATIC_TOKEN in deploy/.env. Never do this in production.
      DEV_INSECURE_AUTH: ${DEV_INSECURE_AUTH:-false}
      DEV_STATIC_TOKEN: ${DEV_STATIC_TOKEN:-}
      DEV_STATIC_GROUPS: ${DEV_STATIC_GROUPS:-}
      # One worker per container: each worker process would spawn its own
      # engine process per tenant. Scale with replicas, not workers.
      WEB_CONCURRENCY: 1
    ports: ["8080:8080"]
    volumes:
      # Mounted read-write even though the indexer is the only logical writer:
      # SQLite in WAL mode needs to create -wal and -shm files to *read*, and
      # the engine keeps its own config and logs under the cache root. Writes
      # are prevented by the tenant tool profile, not by the mount.
      - cbm-cache:/var/lib/repo-mcp/cache
      - repo-workdirs:/var/lib/repo-mcp/repos
    deploy:
      resources:
        limits: { memory: "${GATEWAY_MEMORY_LIMIT:-4g}" }

  indexer:
    <<: *defaults
    build:
      <<: *build-args
      args:
        SERVICE: indexer
        CBM_VERSION: ${CBM_VERSION:-latest}
    depends_on:
      init: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://repomcp:${POSTGRES_PASSWORD}@postgres:5432/repomcp}
      SECRETS_KEY: ${SECRETS_KEY:?set SECRETS_KEY — generate one with 'make generate-key'}
      CONFIG_POLL_SECONDS: ${CONFIG_POLL_SECONDS:-15}
      # Provider tokens now live encrypted in the database. These remain
      # supported for an existing setup and for `repo-mcp-admin import`.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      BITBUCKET_APP_PASSWORD: ${BITBUCKET_APP_PASSWORD:-}
      WEBHOOK_SECRET_GITHUB: ${WEBHOOK_SECRET_GITHUB:-}
      WEBHOOK_SECRET_GITLAB: ${WEBHOOK_SECRET_GITLAB:-}
      WEBHOOK_SECRET_BITBUCKET: ${WEBHOOK_SECRET_BITBUCKET:-}
      CI_TRIGGER_TOKEN: ${CI_TRIGGER_TOKEN:-}
      RESCAN_INTERVAL_S: ${RESCAN_INTERVAL_S:-86400}
      INDEX_CONCURRENCY: ${INDEX_CONCURRENCY:-2}
      WEB_CONCURRENCY: 1
    ports: ["8082:8080"]
    volumes:
      # Both services share the cache root, which is why they must run the
      # same engine build (exact-build admission barrier).
      - cbm-cache:/var/lib/repo-mcp/cache
      - repo-workdirs:/var/lib/repo-mcp/repos
    deploy:
      resources:
        limits: { memory: "${INDEXER_MEMORY_LIMIT:-8g}" }

volumes:
  postgres-data:
  cbm-cache:
  repo-workdirs:
  ollama-models:
