name: Sync dev

# Merging dev into main through a pull request leaves one commit on main that
# dev never gets: the merge commit GitHub writes. The content is identical,
# but the history diverges by one commit per release, and every comparison
# afterwards reports a difference that is not a difference.
#
# Since dev is an ancestor of main at that moment, main -> dev is a plain
# fast-forward. This does exactly that, and nothing else.
#
# The push is deliberately not forced. If dev has moved on since the pull
# request merged, the push is not a fast-forward, the server refuses it, and
# this job fails loudly rather than discarding whatever was pushed to dev in
# the meantime.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-dev
  cancel-in-progress: false

jobs:
  fast-forward:
    name: fast-forward dev to main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bring dev up to main
        run: |
          set -euo pipefail
          git fetch origin main dev

          if git merge-base --is-ancestor origin/main origin/dev; then
            echo "dev already contains main — nothing to do"
            exit 0
          fi

          if ! git merge-base --is-ancestor origin/dev origin/main; then
            echo "::error::dev has commits that main does not, so this is not a"
            echo "::error::fast-forward. Merge main into dev yourself and decide"
            echo "::error::what the result should be — this job will not guess."
            git --no-pager log --oneline origin/main..origin/dev
            exit 1
          fi

          echo "fast-forwarding dev to $(git rev-parse --short origin/main)"
          git push origin origin/main:refs/heads/dev
