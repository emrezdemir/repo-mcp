name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, indexer]
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  build-image:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service: [gateway, indexer]
    steps:
      - uses: actions/checkout@v4

      # Builds without pushing, to catch Dockerfile breakage in review. The
      # CBM download is pinned by CBM_VERSION so the image stays reproducible.
      - name: Build image
        run: |
          docker build \
            --file deploy/Dockerfile \
            --build-arg SERVICE=${{ matrix.service }} \
            --tag repo-mcp-${{ matrix.service }}:ci \
            .
