name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.service }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [common, gateway, indexer]
        python-version: ["3.11", "3.12", "3.13"]

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/pyproject.toml

      - name: Install
        run: |
          # gateway and indexer depend on the shared package by path.
          if [ "${{ matrix.service }}" != "common" ]; then pip install -e ../common; fi
          pip install -e '.[dev]'

      # The interface is built rather than committed, and the gateway's tests
      # cover how it is served. Without this they skip, which would hide a
      # route that stopped working.
      - uses: actions/setup-node@v4
        if: matrix.service == 'gateway'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gateway/webui/package-lock.json

      - name: Build the interface
        if: matrix.service == 'gateway'
        working-directory: gateway/webui
        run: |
          npm ci --no-audit --no-fund
          npm run build
          rm -rf ../app/ui && cp -r dist ../app/ui

      - name: Lint
        run: ruff check --output-format=github .

      - name: Test
        run: pytest -q

  webui:
    name: web interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway/webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gateway/webui/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Types
        run: npx tsc -b
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  branch:
    name: branch name
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Check the branch name
        run: scripts/check-branch.sh "${{ github.head_ref }}"

  docs:
    name: documentation rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # Enforces docs/code-standards.md §5: required files, resolving links,
      # AGENTS.md commands that actually exist, ADR structure including the
      # negative consequences, changelog section, memory-bank freshness.
      - name: Enforce documentation rules
        run: scripts/check-docs.sh

  secrets:
    name: no secrets committed
    runs-on: ubuntu-latest
    steps:
      # Full history: a secret removed in the tip commit is still in the
      # repository, and a reviewer needs to know that before merging.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan every tracked file
        run: scripts/check-secrets.sh --all

      # Environment-specific configuration is what makes long-lived branches
      # conflict on every merge, so it must not be tracked on any of them.
      - name: No environment-specific configuration is tracked
        run: |
          tracked="$(git ls-files \
            | grep -E '(^|/)\.env$|^deploy/(tenants|scan)\.yaml$|^deploy/helm/values-.*\.yaml$' \
            | grep -v '\.example\.yaml$' || true)"
          if [ -n "$tracked" ]; then
            echo "these must never be tracked:"
            echo "$tracked"
            exit 1
          fi
          echo "none tracked"

      - name: The example configuration is present
        run: |
          for f in deploy/.env.example deploy/tenants.example.yaml deploy/scan.example.yaml \
                   deploy/helm/values-dev.example.yaml \
                   deploy/helm/values-production.example.yaml; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          echo "all example files present"

  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: for f in scripts/*.sh; do bash -n "$f"; done

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: ./scripts

      - name: Scripts are executable
        run: |
          missing=0
          for f in scripts/*.sh; do
            case "$f" in */lib.sh) continue ;; esac
            [ -x "$f" ] || { echo "not executable: $f"; missing=1; }
          done
          exit $missing

  config:
    name: example configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install
        run: |
          pip install -e './common[dev]'
          pip install -e './gateway[dev]'
          pip install -e './indexer[dev]'

      # A broken example fails at container start otherwise, which is a much
      # worse place to discover it.
      - name: Validate the shipped examples
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "gateway")
          sys.path.insert(0, "indexer")
          from app.tenants import TenantRegistry

          registry = TenantRegistry.load(Path("deploy/tenants.example.yaml"))
          print("tenants:", [t.name for t in registry.tenants])
          PY
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "indexer")
          from app.repos import ScanConfig

          config = ScanConfig.load(Path("deploy/scan.example.yaml"), Path("/tmp"))
          print("connectors:", [c.name for c in config.connectors])
          PY

  helm:
    name: helm chart
    runs-on: ubuntu-latest
    env:
      # Enough to get past the chart's own required-value checks.
      MINIMUM: >-
        --set database.url=postgresql+asyncpg://u:p@db:5432/repomcp
        --set secretsKey=YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY3OD0=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Install PyYAML
        run: pip install pyyaml

      # Catches what helm cannot: a template reading a .Values path that no
      # longer exists, which renders as an empty string instead of an error.
      - name: Templates and values agree
        run: scripts/check-chart.sh

      - name: Lint
        run: helm lint deploy/helm/repo-mcp --set database.url=x --set secretsKey=y

      - name: Render with the minimum required values
        run: helm template repo-mcp deploy/helm/repo-mcp $MINIMUM > /dev/null

      - name: Render with autoscaling and ReadWriteMany
        run: |
          helm template repo-mcp deploy/helm/repo-mcp $MINIMUM \
            --set gateway.autoscaling.enabled=true \
            --set persistence.cache.accessMode=ReadWriteMany \
            --set ingress.enabled=true \
            --set networkPolicy.enabled=true \
            --set metrics.serviceMonitor.enabled=true > /dev/null

      - name: Render the shipped environment examples
        run: |
          helm template repo-mcp deploy/helm/repo-mcp \
            -f deploy/helm/values-dev.example.yaml \
            --set secretsKey=YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY3OD0= > /dev/null
          # The production example uses an existing secret, so it needs no
          # inline values at all.
          helm template repo-mcp deploy/helm/repo-mcp \
            -f deploy/helm/values-production.example.yaml > /dev/null

      # Each of these renders something that looks fine and behaves badly
      # later, so the chart must refuse rather than warn.
      - name: The chart refuses what it cannot support
        run: |
          refuses() {
            local why="$1"; shift
            if helm template repo-mcp deploy/helm/repo-mcp "$@" >/dev/null 2>&1; then
              echo "expected the chart to refuse: $why"
              exit 1
            fi
            echo "refused: $why"
          }
          # Horizontal gateway scaling without shared storage silently answers
          # queries from an empty graph.
          refuses "autoscaling without ReadWriteMany" $MINIMUM \
            --set gateway.autoscaling.enabled=true \
            --set persistence.cache.accessMode=ReadWriteOnce
          # No database means no configuration at all.
          refuses "no database.url and no existing secret" \
            --set secretsKey=YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY3OD0=
          refuses "no secretsKey and no existing secret" \
            --set database.url=postgresql+asyncpg://u:p@db:5432/repomcp
          # A mutable tag makes "which commit is running" unanswerable.
          refuses "environment=production with tag latest" $MINIMUM \
            --set environment=production --set image.tag=latest
          refuses "environment=production with tag dev" $MINIMUM \
            --set environment=production --set image.tag=dev
          refuses "environment=production with migrations.auto" $MINIMUM \
            --set environment=production --set image.tag=v0.1.0 \
            --set migrations.auto=true

      - name: The compression proxy renders only when pinned
        run: |
          helm template repo-mcp deploy/helm/repo-mcp $MINIMUM \
            --set headroom.enabled=true --set headroom.image.tag=v1.2.3 > /dev/null
          if helm template repo-mcp deploy/helm/repo-mcp $MINIMUM \
               --set headroom.enabled=true >/dev/null 2>&1; then
            echo "expected the chart to refuse an unpinned compression proxy"
            exit 1
          fi
          echo "refused as expected"

      - name: An immutable tag is accepted in production
        run: |
          helm template repo-mcp deploy/helm/repo-mcp $MINIMUM \
            --set environment=production --set image.tag=sha-1a2b3c4 > /dev/null
          echo "accepted"

  docker:
    name: image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [test]
    # Publishing the tested image is what makes a promotion possible at all —
    # see docs/adr/0008-environments-and-promotion.md.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [gateway, indexer]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: repomcp
          POSTGRES_PASSWORD: repomcp
          POSTGRES_DB: repomcp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U repomcp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: postgresql+asyncpg://repomcp:repomcp@127.0.0.1:5432/repomcp

    steps:
      - uses: actions/checkout@v4

      # The publish step below builds linux/arm64 as well, which an amd64
      # runner can only do through QEMU.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
            CBM_VERSION=${{ vars.CBM_VERSION || 'latest' }}
            VERSION=${{ github.sha }}
            VCS_REF=${{ github.sha }}
          tags: repo-mcp-${{ matrix.service }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: The image contains a working engine
        run: docker run --rm --entrypoint codebase-memory-mcp repo-mcp-${{ matrix.service }}:ci --version

      # Against the same database engine production uses. --network host is
      # what lets the image reach the service container.
      - name: The image bootstraps a database
        run: |
          key="$(docker run --rm --entrypoint repo-mcp-admin \
                   repo-mcp-${{ matrix.service }}:ci generate-key)"
          echo "SECRETS_KEY=$key" >> "$GITHUB_ENV"
          # Thrown away with the job. Generated rather than written down, so
          # no literal that looks like a credential lives in this file.
          docker run --rm --network host \
            -e DATABASE_URL="$DB_URL" \
            -e SECRETS_KEY="$key" \
            -e MIGRATE_ON_START=true \
            -e ADMIN_USERNAME=admin \
            -e ADMIN_PASSWORD="$(openssl rand -hex 16)" \
            --entrypoint repo-mcp-admin \
            repo-mcp-${{ matrix.service }}:ci init

      - name: The service starts and answers its probes
        run: |
          docker run -d --name svc --network host \
            -e DATABASE_URL="$DB_URL" \
            -e SECRETS_KEY="$SECRETS_KEY" \
            -e ENVIRONMENT=ci \
            repo-mcp-${{ matrix.service }}:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/metrics | grep -q repo_mcp_
          # An unconfigured service answers /healthz too, so assert readiness
          # as well: that is what proves it reached its configuration.
          curl -fsS http://127.0.0.1:8080/readyz
          docker logs svc
          docker rm -f svc

      # A service that starts without the key would serve requests and then
      # fail on the first credential it had to decrypt, somewhere far from the
      # cause. It must refuse instead — while still answering /healthz, so an
      # orchestrator reports the reason rather than a bare crash loop.
      - name: A service without SECRETS_KEY refuses to become ready
        run: |
          docker run -d --name nokey --network host \
            -e DATABASE_URL="$DB_URL" \
            repo-mcp-${{ matrix.service }}:ci
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/healthz >/dev/null
          code="$(curl -s -o /tmp/nokey.json -w '%{http_code}' http://127.0.0.1:8080/readyz)"
          docker logs nokey 2>&1 | tail -5
          docker rm -f nokey
          if [ "$code" != "503" ]; then
            echo "expected /readyz to answer 503 without SECRETS_KEY, got $code"
            cat /tmp/nokey.json
            exit 1
          fi
          grep -q SECRETS_KEY /tmp/nokey.json || {
            echo "the reason should name SECRETS_KEY:"; cat /tmp/nokey.json; exit 1; }
          echo "refused, and said why"

      # ── publish ────────────────────────────────────────────────────
      # Only from dev, and only after the image above proved it starts. The
      # push reuses the build cache, so it republishes the image that was just
      # tested rather than building a different one.
      # Releases are tagged by .github/workflows/release.yml, not here.

      - name: Log in to the registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish dev-<sha> and dev-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
            CBM_VERSION=${{ vars.CBM_VERSION || 'latest' }}
            VERSION=dev-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          # dev-<sha> is the promotable artifact; dev-latest is a convenience
          # for the dev environment, and is never valid in production.
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:dev-${{ github.sha }}
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:dev-latest
          # Both architectures, because macOS on Apple Silicon is a supported
          # host and an amd64-only image is not merely slow there — it does not
          # work. The container starts and a shell runs, so it looks fine; the
          # engine binary then hangs forever under emulation, which is the one
          # thing the image exists to carry. Only this publish step is
          # multi-platform: the build above uses load:true to run the image in
          # this job, and load cannot take a manifest list.
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
