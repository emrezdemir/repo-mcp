name: Pages

# The project site: site/ for the pages, docs/images/ for the screenshots.
# Assembled by the same script a person runs locally, so what is published is
# what was previewed.

# Published from the default branch, and only from it. GitHub creates the
# `github-pages` deployment environment with a branch policy that admits the
# default branch alone, and a job whose environment refuses its ref does not
# fail with a message — it fails in one second having run no steps at all.
# Guarding on the ref here turns that into a visible skip instead. The other
# way out is to add the branch under Settings -> Environments -> github-pages,
# which is a setting nobody remembers making; this needs no setting.
on:
  push:
    branches: [dev, main]
    paths:
      - "site/**"
      # The reference documentation is rendered onto the site, so a change to
      # any of it has to republish.
      - "docs/**"
      - "scripts/build-site.sh"
      - "scripts/render-docs.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run supersedes an older one rather than
# racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    # Any other branch is a no-op rather than a red run: see the note above.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble
        run: scripts/build-site.sh

      # Every page, including the rendered documentation, and resolved
      # relative to the page rather than to the site root — docs/adr/ sits two
      # levels down and its links are written accordingly.
      - name: Every page and asset it references exists
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path("_site")
          missing, checked = [], 0
          for page in sorted(root.rglob("*.html")):
              text = page.read_text(encoding="utf-8")
              for ref, _ in re.findall(r'(?:src|href)="([^"#:]*)(#[^"]*)?"', text):
                  if not ref or ref.startswith(("http", "mailto", "//")):
                      continue
                  checked += 1
                  target = (page.parent / ref).resolve()
                  if target.is_dir():
                      target = target / "index.html"
                  if not target.exists():
                      missing.append(f"{page.relative_to(root)}: {ref}")
          if missing:
              print("\n".join(missing))
              sys.exit(1)
          print(f"every local reference resolves ({checked} checked)")
          PY

      # enablement turns Pages on for the repository if it is off, which is
      # otherwise a settings change nobody remembers to make.
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Say so if Pages is still not configured
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages could not be configured for this"
          echo "::error::repository. Turn it on once by hand:"
          echo "::error::  Settings -> Pages -> Build and deployment"
          echo "::error::  Source: GitHub Actions"
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
