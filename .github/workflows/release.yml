name: Release

# A version tag is the promotion event. Everything else — branches, pull
# requests, dev images — is handled by ci.yml.
#
#   git tag -a v0.2.0 -m "0.2.0" && git push origin v0.2.0
#
# See docs/environments.md and docs/adr/0008-environments-and-promotion.md.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag is meant to point at a commit that already reached dev and passed
  # there. Checking is cheap; discovering otherwise after production has
  # pulled the image is not.
  guard:
    name: the tag is releasable
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        name: Read the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "not a semantic version: $GITHUB_REF_NAME"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing $version"

      - name: The tagged commit is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_SHA is not on main."
            echo "Releases are cut from main: merge dev into main, then tag."
            exit 1
          fi
          echo "on main"

      - name: The tag matches VERSION, and everything matches VERSION
        run: |
          want="${{ steps.version.outputs.version }}"
          have="$(cat VERSION)"
          if [ "$have" != "$want" ]; then
            echo "VERSION says $have, the tag says $want."
            echo "Run: scripts/version.sh --set $want"
            exit 1
          fi
          # Packages, chart, READMEs and changelog, in one check.
          scripts/version.sh --check

      - name: The changelog has an entry for this version
        run: |
          want="${{ steps.version.outputs.version }}"
          if ! grep -qE "^## \[?$want\]?" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## $want' section."
            echo "A release nobody can read the changes for is not a release."
            exit 1
          fi
          echo "changelog entry present"

  publish:
    name: publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [guard]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [gateway, indexer]
    steps:
      - uses: actions/checkout@v4

      # linux/arm64 on an amd64 runner needs QEMU.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Three tags for one image: the version to deploy, the commit to trace
      # it back to, and a moving pointer for tooling. Production deploys the
      # first two; the chart refuses the third.
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
            CBM_VERSION=${{ vars.CBM_VERSION || 'latest' }}
            VERSION=${{ needs.guard.outputs.version }}
            VCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:latest
          # macOS on Apple Silicon is a supported host, and an amd64-only image
          # does not work there — the container starts, a shell runs, and the
          # engine binary then hangs forever under emulation. See ci.yml.
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}

      - name: The published image runs
        run: |
          image="ghcr.io/${{ github.repository }}-${{ matrix.service }}:${{ github.ref_name }}"
          docker run --rm --entrypoint codebase-memory-mcp "$image" --version
          docker run --rm --entrypoint repo-mcp-admin "$image" generate-key > /dev/null
          echo "$image is runnable"

      # This runner is amd64, so the step above only ever proves amd64. An
      # arm64 variant silently missing from the manifest is precisely the
      # regression nobody would notice until a Mac pulled it and the engine
      # hung, so assert both are there rather than assume the build honoured
      # the platforms list.
      - name: The manifest carries both architectures
        run: |
          image="ghcr.io/${{ github.repository }}-${{ matrix.service }}:${{ github.ref_name }}"
          platforms="$(docker buildx imagetools inspect "$image" --format \
            '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
          echo "manifest: $platforms"
          for want in linux/amd64 linux/arm64; do
            case "$platforms" in
              *"$want"*) ;;
              *) echo "$image has no $want — a Mac or an ARM server cannot run it"; exit 1 ;;
            esac
          done

  chart:
    name: package the chart
    runs-on: ubuntu-latest
    needs: [guard, publish]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The chart is versioned with the images it deploys, so "which chart
      # goes with v0.2.0" is not a question anyone has to answer.
      - name: Package and push
        run: |
          helm package deploy/helm/repo-mcp --destination /tmp/chart
          helm push "/tmp/chart/repo-mcp-${{ needs.guard.outputs.version }}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"

  # A pushed tag is not a release as far as anything that asks GitHub is
  # concerned: /releases/latest answers 404 until a Release object exists. Two
  # things we ship read exactly that endpoint — the interface's update banner
  # (gateway/app/updates.py) and `make upgrade` (scripts/upgrade.sh) — so
  # without this job both stay dead through a release that otherwise went
  # perfectly. v0.4.1 published its images and its chart and neither noticed.
  release:
    name: publish the GitHub release
    runs-on: ubuntu-latest
    needs: [guard, publish, chart]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The notes are the changelog's own section for this version. Writing
      # them again in the release body would be a second copy to drift, and
      # the guard above has already refused a tag whose section is missing.
      - name: Create the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "CHANGELOG.md has no section for $VERSION to use as release notes"
            exit 1
          fi
          gh release create "v$VERSION" --title "$VERSION" --notes-file /tmp/notes.md
          echo "published https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
